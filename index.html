<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>残り色</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=5">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=5">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=5">
<meta name="apple-mobile-web-app-title" content="残り色">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Space+Mono&family=Courier+Prime&family=DM+Mono:wght@400&family=Playfair+Display:wght@500&family=Josefin+Sans:wght@500&family=Caveat:wght@500&family=Shadows+Into+Light&family=Playwrite+AR+Guides&display=swap">
<style>
/* Layout: darkroom bench — photo on the left as the working print, a narrow control strip on the right; stacks on phones. Accent follows the picked colour. */
:root{
  --bg:#ecebe8; --panel:#f7f6f3; --fg:#1d1c1a; --muted:#6b6862; --line:#d5d2cc; --well:#dedbd5;
  --accent:#d0342c;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--panel:#1e1e1c;--fg:#ecebe7;--muted:#9a978f;--line:#33322f;--well:#0d0d0c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--panel:#1e1e1c;--fg:#ecebe7;--muted:#9a978f;--line:#33322f;--well:#0d0d0c;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--sans);font-size:15px;line-height:1.55;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
h1{font-size:1.6rem;font-weight:700;margin:0;letter-spacing:.04em;text-wrap:balance}
h1 span{color:var(--accent);transition:color .3s}
header p{margin:0;color:var(--muted);font-size:.9rem}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:820px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage{background:var(--well);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.canvasbox{position:relative;display:flex;justify-content:center}
canvas{max-width:100%;height:auto;display:block;cursor:crosshair;touch-action:none;border-radius:2px}
.hint{font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint b{color:var(--fg);font-weight:500}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:18px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px}
.label{font-size:.75rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.btn{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:9px 12px;border-radius:4px;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 5px;border:1px solid var(--line);border-radius:4px;background:var(--bg);cursor:pointer;font:inherit;color:var(--fg)}
.chip.active{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.sw{width:26px;height:26px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
.chip code{font-family:var(--mono);font-size:.78rem}
.chip .x{font-size:1rem;line-height:1;color:var(--muted);padding:0 3px;background:none;border:0;cursor:pointer}
.slider{display:flex;flex-direction:column;gap:4px}
.slider .top{display:flex;justify-content:space-between;font-size:.9rem}
.slider .top output{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer;user-select:none;-webkit-user-select:none;padding:1px 6px;margin-right:-6px;border-radius:3px;touch-action:manipulation;transition:background .25s,color .25s}
.slider .top output:hover{background:var(--well);color:var(--fg)}
.slider .top output.changed{color:var(--fg)}
.slider .top output.flash{background:var(--accent);color:#fff}
input[type=range]{width:100%;accent-color:var(--accent)}
.note{font-size:.8rem;color:var(--muted);margin:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.pv{width:100%;height:auto;max-height:340px;object-fit:contain;display:block;background:var(--well);border-radius:4px;padding:10px;box-sizing:border-box}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button,.seg label{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 2px;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
.seg .on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.seg .dot{width:18px;height:18px;border-radius:50%;border:1px solid rgba(128,128,128,.45)}
.seg input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
#frameOpts{display:flex;flex-direction:column;gap:12px}
.fontpick{border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.fontpick summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:4px}
.fontpick summary::-webkit-details-marker{display:none}
.fontpick summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fontpick summary .lbl{font-size:.72rem;color:var(--muted);flex:none}
.fontpick summary .cur{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.fontpick summary .cur .s{font-size:1.02rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fontpick summary .cur .n{font-size:.72rem;color:var(--muted)}
.fontpick summary .chev{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .2s}
.fontpick[open] summary .chev{transform:rotate(-135deg) translate(-2px,-2px)}
.fontpick[open] summary{border-bottom:1px solid var(--line);border-radius:4px 4px 0 0}
.fontpick .fonts{padding:8px}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fonts button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 8px;border-radius:4px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:0}
.fonts button .s{font-size:1.02rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fonts button .n{font-size:.72rem;color:var(--muted)}
.fonts .on{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.result{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.result img{width:100%;max-width:560px;border-radius:2px;align-self:center}
.result p{margin:0;font-size:.9rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>残り<span>色</span> <small style="font-family:var(--mono);font-size:.8rem;font-weight:400;letter-spacing:.08em;color:var(--muted)">nokoriiro</small></h1>
    <p>點照片上的顏色，只留下那個色，其他變成黑白灰。</p>
  </header>

  <div class="bench">
    <div class="stage">
      <div class="canvasbox"><canvas id="cv" width="800" height="560" aria-label="照片，點擊以選取顏色"></canvas></div>
      <div class="hint"><span id="hintText">目前是範例圖。<b>點畫面任一處</b>選取要保留的顏色。</span><span id="dims" style="font-family:var(--mono)"></span></div>
    </div>

    <aside class="panel">
      <div class="sec">
        <div class="label">照片</div>
        <div class="row">
          <label class="btn primary" for="file">選擇照片</label>
          <input id="file" type="file" accept="image/*" hidden>
          <button class="btn" id="hold" type="button">按住看原圖</button>
        </div>
      </div>

      <div class="sec">
        <div class="label">保留的顏色</div>
        <div class="chips" id="chips"></div>
        <button class="btn" id="addColor" type="button">＋ 再加一個顏色</button>
        <p class="note">點選上面的色塊，再點照片就會換成新的顏色。</p>
      </div>

      <div class="sec">
        <div class="label">調整</div>
        <div class="slider"><div class="top"><label for="tol">色相範圍</label><output id="tolO"></output></div><input id="tol" type="range" min="2" max="90" value="22"></div>
        <div class="slider"><div class="top"><label for="soft">邊緣柔和</label><output id="softO"></output></div><input id="soft" type="range" min="0" max="60" value="14"></div>
        <div class="slider"><div class="top"><label for="sat">飽和度門檻</label><output id="satO"></output></div><input id="sat" type="range" min="0" max="60" value="15"></div>
        <div class="slider"><div class="top"><label for="con">黑白對比</label><output id="conO"></output></div><input id="con" type="range" min="50" max="180" value="110"></div>
        <div class="slider"><div class="top"><label for="boost">保留色鮮豔度</label><output id="boostO"></output></div><input id="boost" type="range" min="50" max="180" value="100"></div>
        <p class="note">範圍越大，越接近的顏色也會被保留；飽和度門檻能排除偏灰的區域。在右側數值上點兩下可回到預設值。</p>
      </div>

      <div class="sec">
        <div class="label">外框</div>
        <label class="toggle"><input type="checkbox" id="frameOn" checked> 加上拍立得外框</label>
        <div id="frameOpts">
          <canvas id="pv" class="pv" aria-label="外框預覽"></canvas>
          <div class="seg" id="fcolor" role="group" aria-label="外框顏色">
            <button type="button" data-c="white" class="on"><span class="dot" style="background:#fff"></span>白</button>
            <button type="button" data-c="black"><span class="dot" style="background:#111"></span>黑</button>
            <button type="button" data-c="accent"><span class="dot" id="accDot"></span>保留色</button>
            <label data-c="custom"><span class="dot" id="cusDot" style="background:#e8e1d4"></span>自訂<input type="color" id="fcustom" value="#e8e1d4" aria-label="自訂外框顏色"></label>
          </div>
          <label class="toggle"><input type="checkbox" id="codeOn" checked> 在外框上顯示色碼</label>
          <details class="fontpick" id="fontpick">
            <summary><span class="lbl">字型</span><span class="cur"><span class="s" id="curS"></span><span class="n" id="curN"></span></span><span class="chev" aria-hidden="true"></span></summary>
            <div class="fonts" id="fonts" role="group" aria-label="色碼字型"></div>
          </details>
          <div class="slider"><div class="top"><label for="fpad">邊框寬度</label><output id="fpadO"></output></div><input id="fpad" type="range" min="0" max="20" value="5"></div>
          <div class="slider"><div class="top"><label for="fbot">下方留白</label><output id="fbotO"></output></div><input id="fbot" type="range" min="0" max="40" value="14"></div>
          <p class="note">寬度以照片短邊的百分比計算，照片本身保持原比例，不裁切。</p>
        </div>
      </div>

      <div class="sec">
        <div class="label">儲存</div>
        <button class="btn primary" id="export" type="button">產生成品圖</button>
      </div>
    </aside>
  </div>

  <div class="result" id="result" hidden>
    <img id="outImg" alt="處理後的成品圖">
    <p>手機：長按圖片 →「加入照片」或「儲存影像」。電腦：在圖片上按右鍵另存。</p>
  </div>
</div>

<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d',{willReadFrequently:true});
const MAX=2000;
let W=0,H=0,orig=null,hue,sat,val,lum,showOrig=false;
let colors=[{h:2,s:.8,v:.8,rgb:[208,52,44]}],active=0;
const $=id=>document.getElementById(id);
const S={tol:$('tol'),soft:$('soft'),sat:$('sat'),con:$('con'),boost:$('boost'),fpad:$('fpad'),fbot:$('fbot')};

function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}
  return [h,mx?d/mx:0,mx]}
const hex=c=>'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();
const ss=(a,b,x)=>{if(b<=a)return x>=b?1:0;const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};

function load(img){
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;const k=Math.min(1,MAX/Math.max(w,h));
  W=cv.width=Math.round(w*k);H=cv.height=Math.round(h*k);ctx.drawImage(img,0,0,W,H);
  orig=ctx.getImageData(0,0,W,H);const d=orig.data,n=W*H;
  hue=new Float32Array(n);sat=new Float32Array(n);val=new Float32Array(n);lum=new Float32Array(n);
  for(let i=0,p=0;i<n;i++,p+=4){const r=d[p],g=d[p+1],b=d[p+2];const t=rgb2hsv(r,g,b);hue[i]=t[0];sat[i]=t[1];val[i]=t[2];lum[i]=.2126*r+.7152*g+.0722*b}
  $('dims').textContent=W+' × '+H;render();
}

function render(){
  if(!orig)return;
  if(showOrig){ctx.putImageData(orig,0,0);return}
  const tol=+S.tol.value,soft=+S.soft.value,minS=S.sat.value/100,con=S.con.value/100,boost=S.boost.value/100;
  const out=ctx.createImageData(W,H),o=out.data,d=orig.data,n=W*H;
  for(let i=0,p=0;i<n;i++,p+=4){
    let w=0;const h=hue[i];
    for(let c=0;c<colors.length;c++){let dh=Math.abs(h-colors[c].h);if(dh>180)dh=360-dh;const hw=1-ss(tol,tol+soft+.001,dh);if(hw>w)w=hw}
    if(w>0)w*=ss(minS,minS+.08,sat[i])*ss(.04,.12,val[i]);
    let g=(lum[i]-128)*con+128;g=g<0?0:g>255?255:g;
    let r=d[p],gg=d[p+1],b=d[p+2];
    if(boost!==1&&w>0){const l=lum[i];r=l+(r-l)*boost;gg=l+(gg-l)*boost;b=l+(b-l)*boost}
    o[p]=g+(r-g)*w;o[p+1]=g+(gg-g)*w;o[p+2]=g+(b-g)*w;o[p+3]=255;
  }
  ctx.putImageData(out,0,0);
  drawPreview();
}

function chips(){
  const box=$('chips');box.innerHTML='';
  colors.forEach((c,i)=>{const b=document.createElement('div');b.className='chip'+(i===active?' active':'');b.tabIndex=0;b.setAttribute('role','button');
    b.innerHTML='<span class="sw" style="background:'+hex(c.rgb)+'"></span><code>'+hex(c.rgb)+'</code>'+(colors.length>1?'<button class="x" type="button" aria-label="移除這個顏色">×</button>':'');
    b.onclick=e=>{if(e.target.classList.contains('x')){colors.splice(i,1);active=Math.min(active,colors.length-1)}else active=i;chips();render()};
    b.onkeydown=e=>{if(e.key==='Enter'){active=i;chips()}};
    box.appendChild(b)});
  document.documentElement.style.setProperty('--accent',hex(colors[active].rgb));
  $('addColor').disabled=colors.length>=4;
}

function pick(e){
  if(!orig)return;const r=cv.getBoundingClientRect();
  const x=Math.round((e.clientX-r.left)/r.width*W),y=Math.round((e.clientY-r.top)/r.height*H);
  let R=0,G=0,B=0,c=0;const d=orig.data;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const xx=x+dx,yy=y+dy;if(xx<0||yy<0||xx>=W||yy>=H)continue;const p=(yy*W+xx)*4;R+=d[p];G+=d[p+1];B+=d[p+2];c++}
  if(!c)return;const rgb=[R/c|0,G/c|0,B/c|0],t=rgb2hsv(...rgb);
  colors[active]={h:t[0],s:t[1],v:t[2],rgb};
  $('hintText').innerHTML=t[1]<.12?'這個點接近灰色，色相不明確，建議點顏色更鮮明的地方。':'已選取 <b>'+hex(rgb)+'</b>，可再點別處更換，或用右側滑桿微調。';
  chips();render();
}
cv.addEventListener('pointerdown',pick);

let tm;
Object.entries(S).forEach(([k,el])=>{const o=$(k+'O');const def=el.defaultValue;
  const f=()=>{o.textContent=k==='tol'?'±'+el.value+'°':k==='soft'?el.value+'°':el.value+'%';o.classList.toggle('changed',el.value!==def)};f();
  const fn=k[0]==='f'?drawPreview:render;
  el.addEventListener('input',()=>{f();cancelAnimationFrame(tm);tm=requestAnimationFrame(fn)});
  const reset=()=>{el.value=def;f();fn();o.classList.add('flash');setTimeout(()=>o.classList.remove('flash'),350)};
  o.tabIndex=0;o.setAttribute('role','button');o.title='點兩下回到預設值（'+def+'）';
  let last=0;o.addEventListener('pointerup',e=>{const t=e.timeStamp;if(t-last<350){reset();last=0}else last=t});
  o.addEventListener('dblclick',e=>e.preventDefault());
  o.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();reset()}})});

$('addColor').onclick=()=>{if(colors.length>=4)return;colors.push({...colors[active],rgb:[...colors[active].rgb]});active=colors.length-1;chips();$('hintText').innerHTML='新增了一個顏色欄位，<b>點照片</b>選取第二個要保留的顏色。'};

const hold=$('hold');
const on=e=>{e.preventDefault();showOrig=true;render()},off=()=>{if(showOrig){showOrig=false;render()}};
hold.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(t=>hold.addEventListener(t,off));

$('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);const img=new Image();
  img.onload=()=>{load(img);URL.revokeObjectURL(url);$('result').hidden=true;$('hintText').innerHTML='<b>點照片上的顏色</b>來選取要保留的部分。'};
  img.onerror=()=>{$('hintText').textContent='這個檔案無法開啟。請改用 JPG 或 PNG；iPhone 的 HEIC 照片可先在「照片」App 分享成 JPG。'};
  img.src=url;e.target.value=''});

/* 外框 */
const pv=$('pv'),frameOn=$('frameOn'),codeOn=$('codeOn');let fmode='white';
const FONTS=[
  {n:'IBM Plex Mono',d:'工程等寬',css:'"IBM Plex Mono",ui-monospace,Menlo,monospace',w:500,scale:1},
  {n:'Space Mono',d:'復古等寬',css:'"Space Mono",ui-monospace,Menlo,monospace',w:400,scale:1},
  {n:'Courier Prime',d:'打字機',css:'"Courier Prime","Courier New",monospace',w:400,scale:1.08},
  {n:'DM Mono',d:'輕盈等寬',css:'"DM Mono",ui-monospace,Menlo,monospace',w:400,scale:1},
  {n:'Playfair Display',d:'優雅襯線',css:'"Playfair Display",Georgia,serif',w:500,scale:1.08},
  {n:'Josefin Sans',d:'幾何無襯線',css:'"Josefin Sans",system-ui,sans-serif',w:500,scale:1.08},
  {n:'Caveat',d:'手寫',css:'Caveat,"Comic Sans MS",cursive',w:500,scale:1.35},
  {n:'Shadows Into Light',d:'手寫麻克筆',css:'"Shadows Into Light","Comic Sans MS",cursive',w:400,scale:1.3},
  {n:'Playwrite AR Guides',d:'練字格線',css:'"Playwrite AR Guides","Comic Sans MS",cursive',w:400,scale:.85},
  {n:'系統預設',d:'手機內建',css:'system-ui,-apple-system,sans-serif',w:500,scale:1}
];let fontIdx=0;
function fontButtons(){const box=$('fonts');box.innerHTML='';const t=hex(colors[active].rgb);
  FONTS.forEach((F,i)=>{const b=document.createElement('button');b.type='button';b.className=i===fontIdx?'on':'';
    b.innerHTML='<span class="s" style=\'font-family:'+F.css+';font-weight:'+F.w+'\'>'+t+'</span><span class="n">'+F.n+'・'+F.d+'</span>';
    b.onclick=()=>{fontIdx=i;fontButtons();drawPreview();$('fontpick').open=false};box.appendChild(b)});
  const F=FONTS[fontIdx],cs=$('curS');cs.textContent=t;cs.style.fontFamily=F.css;cs.style.fontWeight=F.w;$('curN').textContent=F.n+'・'+F.d}
function frameRGB(){if(fmode==='white')return[255,255,255];if(fmode==='black')return[17,17,17];if(fmode==='accent')return colors[active].rgb;
  const v=$('fcustom').value;return[1,3,5].map(i=>parseInt(v.substr(i,2),16))}
function compose(maxSide){
  const s=maxSide?Math.min(1,maxSide/Math.max(W,H)):1,iw=Math.round(W*s),ih=Math.round(H*s),base=Math.min(iw,ih);
  const pad=Math.round(base*S.fpad.value/100),bot=pad+Math.round(base*S.fbot.value/100);
  const c=document.createElement('canvas');c.width=iw+pad*2;c.height=ih+pad+bot;const g=c.getContext('2d');
  const fr=frameRGB();g.fillStyle=hex(fr);g.fillRect(0,0,c.width,c.height);
  g.imageSmoothingQuality='high';g.drawImage(cv,pad,pad,iw,ih);
  if(codeOn.checked&&bot>0){
    const F=FONTS[fontIdx];let fs=Math.min(base*.042,bot*.38)*F.scale;
    if(fs>=4){
      const L=(.2126*fr[0]+.7152*fr[1]+.0722*fr[2])/255;
      const txt=colors.map(col=>hex(col.rgb)).join('   ');
      g.font=F.w+' '+fs+'px '+F.css;
      const maxW=iw*.92,tw=g.measureText(txt).width;if(tw>maxW){fs*=maxW/tw;g.font=F.w+' '+fs+'px '+F.css}
      g.textAlign='center';g.textBaseline='middle';
      g.fillStyle=L>.55?'rgba(29,28,26,.88)':'rgba(255,255,255,.9)';
      g.fillText(txt,c.width/2,pad+ih+bot/2+fs*.04);
    }
  }
  return c;
}
function drawPreview(){
  if(!orig||showOrig)return;
  $('accDot').style.background=hex(colors[active].rgb);
  const sw=hex(colors[active].rgb);document.querySelectorAll('#fonts .s,#curS').forEach(s=>s.textContent=sw);
  if(!frameOn.checked)return;
  const c=compose(640);pv.width=c.width;pv.height=c.height;pv.getContext('2d').drawImage(c,0,0);
}
$('fcolor').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;fmode=b.dataset.c;
  $('fcolor').querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));drawPreview()});
$('fcustom').addEventListener('input',e=>{$('cusDot').style.background=e.target.value;fmode='custom';
  $('fcolor').querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x.dataset.c==='custom'));drawPreview()});
frameOn.addEventListener('change',()=>{$('frameOpts').hidden=!frameOn.checked;drawPreview()});
codeOn.addEventListener('change',drawPreview);
fontButtons();
try{Promise.all(FONTS.map(F=>document.fonts.load(F.w+' 40px '+F.css,'#0123456789ABCDEF'))).then(drawPreview,drawPreview)}catch(e){}

$('export').onclick=()=>{showOrig=false;render();const img=$('outImg');img.src=(frameOn.checked?compose(0):cv).toDataURL('image/jpeg',.92);$('result').hidden=false;$('result').scrollIntoView({behavior:'smooth',block:'start'})};

/* 範例圖：雨天街景與一把紅傘 */
function sample(){
  const c=document.createElement('canvas');c.width=800;c.height=560;const g=c.getContext('2d');
  let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  let gr=g.createLinearGradient(0,0,0,560);gr.addColorStop(0,'#9db3c4');gr.addColorStop(.6,'#c9d2d6');gr.addColorStop(1,'#6e7376');g.fillStyle=gr;g.fillRect(0,0,800,560);
  const bc=['#8a6f5a','#6f7d86','#a39785','#5d6a5a','#b58f6a'];
  for(let x=0;x<800;){const w=90+rnd()*90,h=180+rnd()*170;g.fillStyle=bc[(rnd()*bc.length)|0];g.fillRect(x,380-h,w,h+20);
    g.fillStyle='rgba(30,40,50,.45)';for(let wy=380-h+16;wy<370;wy+=34)for(let wx=x+12;wx<x+w-20;wx+=28)g.fillRect(wx,wy,14,20);x+=w+4}
  g.fillStyle='#4f5456';g.fillRect(0,390,800,170);
  g.fillStyle='rgba(255,255,255,.12)';for(let i=0;i<8;i++)g.fillRect(i*110,470,60,8);
  [[70,330,'#3f7d3a'],[120,300,'#4d8f40'],[720,320,'#3e7a3a']].forEach(([x,y,col])=>{g.fillStyle='#5a4030';g.fillRect(x-6,y,12,90);g.fillStyle=col;g.beginPath();g.arc(x,y,55,0,7);g.fill()});
  g.fillStyle='#e2b42a';g.fillRect(560,372,170,62);g.fillRect(590,346,100,30);g.fillStyle='#2b2b2b';g.beginPath();g.arc(600,436,16,0,7);g.arc(690,436,16,0,7);g.fill();
  g.fillStyle='#2e5fa8';g.fillRect(200,400,60,40);
  g.fillStyle='#2a2826';g.fillRect(385,380,30,110);g.beginPath();g.arc(400,366,16,0,7);g.fill();
  g.strokeStyle='#222';g.lineWidth=4;g.beginPath();g.moveTo(400,300);g.lineTo(400,385);g.stroke();
  g.fillStyle='#d0342c';g.beginPath();g.moveTo(320,330);g.quadraticCurveTo(400,240,480,330);g.closePath();g.fill();
  g.fillStyle='#a8241f';g.beginPath();g.moveTo(400,268);g.quadraticCurveTo(410,300,400,330);g.quadraticCurveTo(390,300,400,268);g.fill();
  g.strokeStyle='rgba(230,235,240,.35)';g.lineWidth=1;for(let i=0;i<260;i++){const x=rnd()*800,y=rnd()*560;g.beginPath();g.moveTo(x,y);g.lineTo(x-6,y+18);g.stroke()}
  load(c);
}
chips();sample();
})();
