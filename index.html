<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Keepsake</title>
<meta name="description" content="導入照片，只留下想要的顏色、畫上手繪花邊、貼圖和文字，加上拍立得外框，再存回相簿。">
<meta name="theme-color" content="#1c1a1f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keepsake">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Huninn&family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@500&family=Space+Mono&family=Courier+Prime&family=DM+Mono&family=Playfair+Display:wght@500&family=Josefin+Sans:wght@500&family=Shadows+Into+Light&family=Playwrite+AR+Guides&display=swap">
<style>
/* Layout: one-screen phone photo editor — slim header, photo stage in the middle, option tray + tool bar docked at the bottom; on wide screens the tray becomes a side panel. Flow: home (pick 留色 or 花邊) → crop → edit → frame → export. Single warm-dark "darkroom" look on purpose so photos and doodle colors pop. */
:root{
  --bg:#1c1a1f; --tray:#262329; --chip:#322e36; --line:#423d47;
  --fg:#f4ede4; --muted:#a79eac; --accent:#f6d24a; --pink:#f28bb5; --danger:#e0546f;
  --hand:"LXGW WenKai TC","Kaiti TC","STKaiti","KaiTi",cursive;
  --sans:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:#1c1a1f;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{height:100%;margin:0;font-size:14px;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
.app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.app{height:100%;max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--hand);font-size:20px;font-weight:700;margin:0;flex:1;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1 span{color:var(--accent)}
.btn{font:600 14px/1 var(--sans);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.primary{background:var(--accent);color:#2a2306;border-color:transparent}
.btn:disabled{opacity:.35;cursor:default}
.ibtn{width:38px;height:38px;padding:0;line-height:0;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:none;box-sizing:border-box;-webkit-appearance:none;appearance:none}
.ibtn svg,.tool svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn:disabled{opacity:.35}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
canvas#cv{display:block;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.45);touch-action:none;transform-origin:center center;flex:none}
.stage.crop canvas#cv{box-shadow:none;border-radius:0}
.pill{position:absolute;left:50%;transform:translateX(-50%);font:12px var(--sans);background:rgba(0,0,0,.66);color:#fff;padding:6px 12px;border-radius:999px;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#badge{top:8px}
#status{bottom:10px}
#zoomReset{position:absolute;top:8px;right:max(12px,env(safe-area-inset-right,0px))}
.tray{background:var(--tray);border-top:1px solid var(--line);border-radius:18px 18px 0 0;display:grid;gap:10px;padding-block:12px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tray section{display:grid;gap:10px;min-width:0}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-width:0}
.row::-webkit-scrollbar{display:none}
.line2{display:flex;gap:10px;align-items:center;min-width:0}
.chip{flex:none;display:grid;justify-items:center;gap:3px;background:var(--chip);border:1.5px solid transparent;border-radius:12px;padding:6px 8px 5px;cursor:pointer;color:var(--fg);font:13px var(--hand)}
.chip[aria-pressed="true"]{border-color:var(--accent)}
.chip canvas{width:52px;height:30px;display:block}
.chip.st canvas{width:34px;height:34px}
.chip.txt{padding:8px 12px;font-size:14px}
.chip.font span{font-size:20px;line-height:1.1}
.chip.preset canvas{width:96px;height:54px;border-radius:8px}
.seg4{display:grid;grid-template-columns:repeat(4,1fr);background:var(--chip);border-radius:10px;padding:3px;flex:1;min-width:0}
.seg4 button{font:600 13px var(--hand);color:var(--muted);background:none;border:0;border-radius:8px;padding:7px 2px;cursor:pointer}
.seg4 button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}
.hint{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5;flex:1;min-width:0}
.colors{display:flex;gap:9px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:2px}
.colors::-webkit-scrollbar{display:none}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;flex:none;position:relative}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 3px var(--bg) inset}
.sw.rainbow{background:conic-gradient(#f6d24a,#f28bb5,#b38df2,#9cc9f2,#8fd6a8,#f6d24a);overflow:hidden}
.sw.rainbow input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.dropper{flex:none;font:600 12px var(--sans);color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 10px;cursor:pointer}
.dropper[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.glow{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex:none}
.glow input{accent-color:var(--accent);width:18px;height:18px}
.size{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.size input{flex:1;accent-color:var(--accent);min-width:0}
.dial{display:flex;align-items:center;gap:12px}
.dialbody{flex:1;display:grid;justify-items:center;gap:2px;min-width:0}
.dialbody output{font:600 13px var(--sans);font-variant-numeric:tabular-nums;color:var(--accent);cursor:pointer}
#straight{width:100%;-webkit-appearance:none;appearance:none;height:26px;background:
  linear-gradient(var(--fg),var(--fg)) center/2px 14px no-repeat,
  repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 9px) center/100% 8px no-repeat;opacity:.95}
#straight::-webkit-slider-thumb{-webkit-appearance:none;width:4px;height:26px;border-radius:2px;background:var(--accent);border:0}
#straight::-moz-range-thumb{width:4px;height:26px;border-radius:2px;background:var(--accent);border:0}
.tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;border-top:1px solid var(--line);padding-top:6px}
.tool{display:grid;justify-items:center;gap:3px;background:none;border:0;color:var(--muted);font:12px var(--sans);padding:6px 0;border-radius:10px;cursor:pointer;white-space:nowrap;min-width:0}
.kchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.kchips::-webkit-scrollbar{display:none}
.kchip{flex:none;display:flex;align-items:center;gap:6px;background:var(--chip);border:1.5px solid transparent;border-radius:999px;padding:3px 8px 3px 3px;color:var(--fg);font:600 12px ui-monospace,Menlo,monospace;cursor:pointer}
.kchip[aria-pressed="true"]{border-color:var(--accent)}
.kchip i{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25)}
.kchip b{color:var(--muted);font:400 16px/1 var(--sans);padding:0 2px}
.sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px}
.sl{display:grid;gap:1px;min-width:0}
.sl .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.sl output{font:600 12px var(--sans);font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer;padding:1px 6px;margin-right:-6px;border-radius:4px;touch-action:manipulation;transition:background .25s,color .25s}
.sl output.changed{color:var(--accent)}
.sl output.flash{background:var(--accent);color:#2a2306}
.sl input{width:100%;accent-color:var(--accent);margin:0}
.chip.fc{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:13px;position:relative}
.chip.fc i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
.chip.fc input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
#codeFonts .chip.font span{font-size:15px}
@media (min-width:900px) and (min-height:560px){
  .app{max-width:1280px;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);column-gap:16px;padding:0 16px 16px;box-sizing:border-box}
  header{grid-column:1/-1;padding-inline:0}
  .stage{grid-row:2;padding-inline:0}
  .tray{grid-row:2;grid-column:2;border:1px solid var(--line);border-radius:18px;align-content:start;overflow-y:auto;padding:14px 16px}
  .tools{order:-1;grid-template-columns:repeat(5,minmax(0,1fr));border-top:0;border-bottom:1px solid var(--line);padding:0 0 8px}
  .row,.colors,.kchips{flex-wrap:wrap;overflow:visible}
  .steps button{font-size:17px;padding:6px 8px}
}
.tool[aria-pressed="true"]{color:var(--accent);background:var(--chip)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,8,12,.88);display:grid;place-items:center;gap:12px;align-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet img{max-width:100%;max-height:68vh;border-radius:6px;-webkit-touch-callout:default;user-select:auto}
.sheet p{margin:0;font:17px var(--hand);text-align:center;max-width:30ch}
.sheet small{color:var(--muted);font-size:12px;text-align:center}
.tsheet{position:fixed;inset:0;z-index:25;background:rgba(10,8,12,.6);display:flex;align-items:flex-start;justify-content:center;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.tcard{width:100%;max-width:520px;background:var(--tray);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.tcard h2{margin:0;font:700 17px var(--hand);letter-spacing:.04em}
.tcard textarea{width:100%;box-sizing:border-box;resize:none;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:18px var(--hand)}
.tcard .actions{display:flex;gap:8px;justify-content:flex-end}
@media (prefers-reduced-motion:no-preference){.chip,.sw,.btn,.tool{transition:border-color .15s,background-color .15s,transform .1s}.btn:active{transform:scale(.97)}}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
a.btn{text-decoration:none}
.steps{display:flex;align-items:center;justify-content:center;gap:0;flex:1;min-width:0}
header:has(.steps){gap:6px}
header #next{padding-inline:12px}
.steps button{background:none;border:0;color:var(--muted);font:700 13.5px var(--hand);padding:6px 1px;cursor:pointer;white-space:nowrap;letter-spacing:.04em}
.steps button[aria-current="step"]{color:var(--accent)}
.steps i{color:var(--muted);opacity:.5;font-style:normal;font-size:12px}
.home{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;display:grid;grid-template-columns:minmax(0,1fr);align-content:center;justify-items:center;gap:16px;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.brand{display:grid;justify-items:center;gap:4px}
.brand h1{font-size:36px;flex:none;overflow:visible}
.brand p{margin:0;color:var(--muted);font:16px var(--hand);letter-spacing:.06em}
.modes{display:grid;gap:12px;width:100%;max-width:560px;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr))}
.mode{display:grid;gap:4px;text-align:left;background:var(--tray);border:1.5px solid var(--line);border-radius:18px;padding:12px 12px 14px;color:var(--fg);cursor:pointer;font-family:var(--sans)}
.mode:hover{border-color:var(--accent)}
.mode canvas{width:100%;height:118px;border-radius:12px;display:block;margin-bottom:6px}
.mode b{font:700 21px var(--hand);letter-spacing:.06em;display:flex;align-items:baseline;gap:8px}
.mode b small{font:500 13px var(--sans);color:var(--muted);letter-spacing:.08em}
.kchip.empty{cursor:default;color:var(--muted);font:600 12px var(--sans)}
.kchip.empty i{border:1.5px dashed var(--muted);background:none}
.mode span{font-size:13px;color:var(--muted)}
.links{margin:0;font-size:13px;color:var(--muted);text-align:center}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:4px 2px;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>

<div class="app">
  <header>
    <button class="ibtn" id="back" aria-label="上一步"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <nav class="steps" id="steps" aria-label="步驟"><button data-step="crop">裁切</button><i>›</i><button data-step="edit">残り色</button><i>›</i><button data-step="frame">外框</button></nav>
    <input type="file" id="file" accept="image/*" hidden>
    <button class="ibtn" id="hold" aria-label="按住看原圖" title="按住看原圖"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <button class="ibtn" id="undo" aria-label="復原"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="btn primary" id="next">下一步</button>
  </header>

  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="pill" id="badge" hidden>範例照片 · 回首頁可以換成你的照片</div>
    <div class="pill" id="status" hidden></div>
    <button class="btn sm" id="zoomReset" hidden>還原縮放</button>
  </div>

  <div class="tray">
    <section data-panel="draw">
      <div class="row" id="styles" aria-label="線條樣式"></div>
      <div class="line2"><div class="seg4" id="textures" aria-label="筆刷質感"></div><label class="glow"><input type="checkbox" id="glow" checked>微光</label></div>
    </section>
    <section data-panel="sticker" hidden>
      <div class="row" id="stickers" aria-label="小圖案"></div>
      <p class="hint">點空白處貼上；點貼圖可拖移，拉右下角圓點縮放旋轉，也可以用兩指。</p>
    </section>
    <section data-panel="text" hidden>
      <div class="row" id="fontsRow" aria-label="字體"></div>
      <p class="hint">點空白處加入文字；點文字可拖移，按左上角鉛筆修改內容。</p>
    </section>
    <section data-panel="erase" hidden>
      <div class="line2"><p class="hint">用手指劃過要擦掉的線條、貼圖或文字。</p><button class="btn sm" id="clear">全部清除</button></div>
    </section>
    <section data-panel="crop" hidden>
      <div class="row" id="aspects" aria-label="裁切比例"></div>
      <div class="dial">
        <button class="ibtn" id="rotL" aria-label="向左旋轉 90 度"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
        <div class="dialbody"><output id="angleVal" title="點一下回到 0°">0°</output><input type="range" id="straight" min="-45" max="45" step="0.5" value="0" aria-label="拉直角度"></div>
        <button class="ibtn" id="flipH" aria-label="水平翻轉"><svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M8 7l-5 5 5 5z"/><path d="M16 7l5 5-5 5z"/></svg></button>
      </div>
      <div class="line2"><p class="hint">拖四角裁切、拉刻度轉正；不需要就按「下一步」。</p><button class="btn sm" id="repick">換一張</button><button class="btn sm" id="cropReset">重設</button></div>
    </section>
    <section data-panel="keep" hidden>
      <div class="line2"><div class="kchips" id="kchips" aria-label="保留的顏色"></div><button class="btn sm" id="kadd">＋顏色</button></div>
      <div class="sliders" id="ksliders"></div>
      <p class="hint">點照片選要保留的顏色，其他變成黑白灰。點上方色塊切換要調整哪個顏色；數值點兩下回預設。</p>
    </section>
    <section data-panel="frame" hidden>
      <div class="row" id="framePresets" aria-label="外框樣式"></div>
      <div class="line2"><div class="row" id="fcolors" aria-label="外框顏色"></div><label class="glow"><input type="checkbox" id="codeOn">色碼</label></div>
      <div class="sliders" id="fsliders"></div>
      <div class="row" id="codeFonts" aria-label="色碼字型"></div>
    </section>
    <section data-panel="style" hidden>
      <div class="row" id="presets" aria-label="一鍵風格"></div>
      <p class="hint">選一個風格會換好顏色、線條和亮片圖案，接著直接畫就行。</p>
    </section>
    <div class="colors" id="colors" data-for="draw sticker text"></div>
    <div class="size" data-for="draw sticker text erase"><span id="sizeLbl">粗細</span><input type="range" id="width" min="2" max="16" value="6" aria-label="粗細"><button class="btn sm" id="sprinkle" data-for="draw sticker">灑亮片</button></div>
    <nav class="tools" id="tools" aria-label="工具"></nav>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <img id="out" alt="完成的圖片">
  <div class="sheet-actions">
    <button class="btn primary" id="share" hidden>儲存到相簿／分享</button>
    <a class="btn" id="download" href="#" download="keepsake.jpg">下載圖片</a>
  </div>
  <small>也可以長按圖片，選「加入照片」</small>
  <button class="btn" id="close">回去調整</button>
</div>

<div class="home" id="home">
  <div class="brand"><h1><span>Keep</span>sake</h1><p>把照片變成值得留下的紀念</p></div>
  <div class="modes">
    <button class="mode" data-mode="keep"><canvas id="mKeep"></canvas><b>残り色<small>nokoriiro</small></b><span>只留下想要的顏色，其他變成黑白</span></button>
    <button class="mode" data-mode="doodle"><canvas id="mDoodle"></canvas><b>落書き<small>rakugaki</small></b><span>畫上手繪花邊、貼圖和文字</span></button>
  </div>
  <button class="btn" id="resume" hidden>繼續上次的作品</button>
  <p class="links">沒有照片？用範例試試：<button class="linkbtn" data-sample="keep">残り色</button>・<button class="linkbtn" data-sample="doodle">落書き</button></p>
</div>

<div class="tsheet" id="tsheet" hidden>
  <div class="tcard">
    <h2 id="tTitle">加入文字</h2>
    <textarea id="tinput" rows="2" placeholder="例如：今天的花 ♡"></textarea>
    <div class="row" id="tfonts"></div>
    <div class="actions"><button class="btn" id="tcancel">取消</button><button class="btn primary" id="tok">完成</button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

/* ---------- small helpers ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const clone=o=>JSON.parse(JSON.stringify(o));
function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function rgbHex(r,g,b){return'#'+[r,g,b].map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('').toUpperCase()}
function rgbHsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=(mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4)*60}return[h,s,l]}
function hslHex(h,s,l){const f=n=>{const k=(n+h/30)%12,a=s*Math.min(l,1-l);return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return rgbHex(f(0)*255,f(8)*255,f(4)*255)}

const scaleOf=c=>{const t=c.getTransform();return Math.hypot(t.a,t.b)||1};

function resample(pts,step){

    acc+=d;prev=p}

}
function smooth(p,n){for(let k=0;k<n;k++)p=p.map((pt,i)=>{if(i===0||i===p.length-1)return pt;const a=p[i-1],b=p[i+1];return{x:(a.x+pt.x*2+b.x)/4,y:(a.y+pt.y*2+b.y)/4}});return p}
function process(raw,w,style,seed){

    if(i>0)s+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
    let off=n(s/(w*14))*w*.45;
    if(style==='wavy')off+=Math.sin(s/(w*2.2))*w*1.3;
    if(style==='double')off+=Math.sin(s/(w*3.6))*w*.7;
    out.push({x:p[i].x+nx*off,y:p[i].y+ny*off,nx,ny,s});

}
function curve(c,p,off=0){
  const P=off?p.map(q=>({x:q.x+q.nx*off,y:q.y+q.ny*off})):p;
  c.beginPath();c.moveTo(P[0].x,P[0].y);
  for(let i=1;i<P.length-1;i++)c.quadraticCurveTo(P[i].x,P[i].y,(P[i].x+P[i+1].x)/2,(P[i].y+P[i+1].y)/2);
  const L=P[P.length-1];c.lineTo(L.x,L.y);c.stroke();
}

/* ---------- brush textures ---------- */
const patCache=new Map();
function paint(c,color,tex,w){
  if(tex!=='crayon'&&tex!=='chalk')return color;
  const key=color+tex;let t=patCache.get(key);
  if(!t){t=document.createElement('canvas');t.width=t.height=96;const g=t.getContext('2d'),id=g.createImageData(96,96),[r,gg,b]=hexRgb(color),R=rng(tex==='chalk'?11:7);

    g.putImageData(id,0,0);patCache.set(key,t)}
  const p=c.createPattern(t,'repeat');try{p.setTransform(new DOMMatrix().scale(Math.max(.6,w/(tex==='chalk'?4:5))))}catch(e){}
  return p;
}
function ink(c,color,lw,glow,tex,w){
  const st=paint(c,color,tex,w||lw);c.strokeStyle=st;c.fillStyle=st;c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';
  c.shadowColor=glow?color:'transparent';c.shadowBlur=glow?lw*1.6*scaleOf(c):0;
}
function glitter(c,p,it,off){
  const R=rng((it.seed^0x5bd1)+(off>0?1:0)),w=it.w;
  c.shadowColor='#FFF8D0';c.shadowBlur=it.glow?w*scaleOf(c):0;
  for(const q of p){if(R()>.42)continue;const o=off+(R()-.5)*w*1.1,x=q.x+q.nx*o,y=q.y+q.ny*o;
    c.fillStyle=R()<.55?'#FFFBEA':lighten(it.color,.55);c.beginPath();c.arc(x,y,w*(.07+R()*.16),0,7);c.fill();
    if(R()<.05){const s=w*1.1;c.beginPath();c.moveTo(x,y-s);c.quadraticCurveTo(x,y,x+s*.7,y);c.quadraticCurveTo(x,y,x,y+s);c.quadraticCurveTo(x,y,x-s*.7,y);c.quadraticCurveTo(x,y,x,y-s);c.fill()}}
}

/* ---------- drawing items ---------- */
function drawStroke(c,it){
  const w=it.w,tex=it.texture||'smooth';c.save();c.setLineDash([]);
  if(it.pts.length<2){ink(c,it.color,w,it.glow,tex);c.beginPath();c.arc(it.pts[0].x,it.pts[0].y,w*.5,0,7);c.fill();c.restore();return}
  const p=process(it.pts,w,it.style,it.seed),gl=tex==='glitter';
  if(it.style==='double'){
    ink(c,it.color,w*.75,it.glow,tex,w);curve(c,p,w*1.05);
    ink(c,pairFor(it.color),w*.75,it.glow,tex,w);curve(c,p,-w*1.05);
    if(gl){glitter(c,p,it,w*1.05);glitter(c,p,it,-w*1.05)}
  }else if(it.style==='dash'){
    ink(c,it.color,w,it.glow,tex,w);c.setLineDash([w*1.6,w*2.6]);curve(c,p);c.setLineDash([]);if(gl)glitter(c,p,it,0);
  }else if(it.style==='ticks'){
    ink(c,it.color,w*.8,it.glow,tex,w);let next=0;
    for(const q of p)if(q.s>=next){c.beginPath();c.moveTo(q.x-q.nx*w*1.1,q.y-q.ny*w*1.1);c.lineTo(q.x+q.nx*w*1.1,q.y+q.ny*w*1.1);c.stroke();next=q.s+w*3.6}
  }else{ink(c,it.color,w,it.glow,tex,w);curve(c,p);if(gl)glitter(c,p,it,0)}
  c.restore();
}
function stickerPath(c,type,s){
  c.lineWidth=Math.max(1,s*.13);
  switch(type){
    case'sparkle':c.beginPath();c.moveTo(0,-s);c.quadraticCurveTo(s*.08,-s*.08,s*.8,0);c.quadraticCurveTo(s*.08,s*.08,0,s);c.quadraticCurveTo(-s*.08,s*.08,-s*.8,0);c.quadraticCurveTo(-s*.08,-s*.08,0,-s);c.closePath();c.globalAlpha*=.35;c.fill();c.globalAlpha/=.35;c.stroke();break;
    case'star':c.beginPath();for(let i=0;i<10;i++){const r=i%2?s*.45:s,a=-Math.PI/2+i*Math.PI/5;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath();c.stroke();break;
    case'heart':c.beginPath();c.moveTo(0,s*.75);c.bezierCurveTo(-s*1.3,-s*.1,-s*.6,-s*1.05,0,-s*.35);c.bezierCurveTo(s*.6,-s*1.05,s*1.3,-s*.1,0,s*.75);c.closePath();c.stroke();break;
    case'smile':c.beginPath();c.arc(0,0,s,0,7);c.stroke();c.beginPath();c.ellipse(-s*.35,-s*.22,s*.08,s*.14,0,0,7);c.ellipse(s*.35,-s*.22,s*.08,s*.14,0,0,7);c.fill();c.beginPath();c.arc(0,s*.05,s*.52,.18*Math.PI,.82*Math.PI);c.stroke();break;
    case'flower':for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;c.beginPath();c.arc(Math.cos(a)*s*.55,Math.sin(a)*s*.55,s*.4,0,7);c.stroke()}c.beginPath();c.arc(0,0,s*.22,0,7);c.fill();break;
    case'crown':c.beginPath();c.moveTo(-s,s*.5);c.lineTo(-s,-s*.45);c.lineTo(-s*.5,s*.05);c.lineTo(0,-s*.65);c.lineTo(s*.5,s*.05);c.lineTo(s,-s*.45);c.lineTo(s,s*.5);c.closePath();c.stroke();break;
    case'spiral':c.beginPath();for(let t=0;t<=Math.PI*4.2;t+=.15){const r=s*t/(Math.PI*4.2);c.lineTo(Math.cos(t)*r,Math.sin(t)*r)}c.stroke();break;
    case'loops':c.beginPath();for(let i=-1;i<=1;i++)c.arc(i*s*.6,-s*.1,s*.3,Math.PI,0,true);c.stroke();break;
    case'plus':c.beginPath();c.moveTo(0,-s*.7);c.lineTo(0,s*.7);c.moveTo(-s*.7,0);c.lineTo(s*.7,0);c.stroke();break;
    case'dot':c.beginPath();c.arc(0,0,s*.28,0,7);c.fill();break;
    case'arcs':for(let i=0;i<3;i++){c.beginPath();c.arc(-s*.9,0,s*(.5+i*.32),-.45,.45);c.stroke()}break;
    case'paw':c.beginPath();c.ellipse(0,s*.32,s*.44,s*.36,0,0,7);c.fill();
      for(const[x,y,a]of[[-.66,-.18,-.5],[-.25,-.62,-.15],[.25,-.62,.15],[.66,-.18,.5]]){c.beginPath();c.ellipse(x*s,y*s,s*.17,s*.23,a,0,7);c.fill()}break;
    case'fishbone':c.beginPath();c.ellipse(-s*.6,0,s*.32,s*.36,0,0,7);c.stroke();c.beginPath();c.arc(-s*.66,-s*.08,s*.07,0,7);c.fill();
      c.beginPath();c.moveTo(-s*.28,0);c.lineTo(s*.72,0);c.stroke();
      for(const[x,h]of[[-.08,.36],[.2,.3],[.46,.22]]){c.beginPath();c.moveTo(x*s,-h*s);c.quadraticCurveTo(x*s+s*.13,0,x*s,h*s);c.stroke()}
      c.beginPath();c.moveTo(s*.72,0);c.lineTo(s,-s*.3);c.moveTo(s*.72,0);c.lineTo(s,s*.3);c.stroke();break;
    case'yarn':c.beginPath();c.arc(0,0,s*.75,0,7);c.stroke();

      for(const r of[.5,.8]){c.beginPath();c.arc(s*.7,-s*.6,s*r,1.6,3.2);c.stroke()}c.restore();
      c.beginPath();c.moveTo(s*.55,s*.52);c.bezierCurveTo(s*.9,s*.85,s*1.1,s*.45,s*.85,s*.35);c.bezierCurveTo(s*.65,s*.3,s*.75,s*.95,s*1.05,s*.95);c.stroke();break;
    case'catface':c.beginPath();c.moveTo(-s*.75,-s*.05);c.lineTo(-s*.68,-s*.85);c.lineTo(-s*.3,-s*.5);c.quadraticCurveTo(0,-s*.6,s*.3,-s*.5);c.lineTo(s*.68,-s*.85);c.lineTo(s*.75,-s*.05);
      c.quadraticCurveTo(s*.8,s*.7,0,s*.7);c.quadraticCurveTo(-s*.8,s*.7,-s*.75,-s*.05);c.stroke();

      c.beginPath();c.arc(-s*.09,s*.22,s*.09,0,Math.PI);c.moveTo(s*.18,s*.22);c.arc(s*.09,s*.22,s*.09,0,Math.PI);c.stroke();

const fontOf=id=>FONTS.find(f=>f.id===id)||FONTS[0];
const fontStr=it=>{const F=fontOf(it.font);return`${F.w} ${it.s}px ${F.fam}, "PingFang TC", "Noto Sans TC", sans-serif`};
function drawSticker(c,it,flip=!!V?.flip){
  c.save();c.translate(it.x,it.y);c.rotate(it.rot);if(flip)c.scale(-1,1);ink(c,it.color,1,it.glow,it.texture,it.s*.2);c.setLineDash([]);stickerPath(c,it.type,it.s);c.restore();
}
function drawText(c,it){
  c.save();c.translate(it.x,it.y);c.rotate(it.rot);if(V?.flip)c.scale(-1,1);ink(c,it.color,1,it.glow,'smooth');
  c.font=fontStr(it);c.textAlign='center';c.textBaseline='middle';
  const L=it.text.split('\n'),lh=it.s*1.25;L.forEach((l,i)=>c.fillText(l,0,(i-(L.length-1)/2)*lh));c.restore();

/* ---------- colour keep (black & white except the picked hues) ---------- */
const proc=document.createElement('canvas'),qctx=proc.getContext('2d');
let KD=null,kKey='';
const ss=(a,b,x)=>{if(b<=a)return x>=b?1:0;const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function prepKeep(){
  // per-pixel hue (0.5° steps), HSV saturation, value and luma, computed once per photo so slider drags only do table lookups
  const w=photo.width,h=photo.height,n=w*h,d=pctx.getImageData(0,0,w,h).data;
  const hue=new Uint16Array(n),sat=new Uint8Array(n),val=new Uint8Array(n),lum=new Uint8Array(n);
  for(let i=0,p=0;i<n;i++,p+=4){const r=d[p],g=d[p+1],b=d[p+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),dd=mx-mn;let hh=0;

function singleDown(e){

function startPinch(){

    gesture={type:'itemPinch',it:s,d0:Math.max(1,dist(pa,pb)),a0:Math.atan2(pb.y-pa.y,pb.x-pa.x),m0:{x:(pa.x+pb.x)/2,y:(pa.y+pb.y)/2},x0:s.x,y0:s.y,s0:s.s,r0:s.rot};liveIds=new Set([s.id]);

}

/* ---------- eraser ---------- */
function eraseAlong(a,b){
  const r=S.width*unit()*2.2,n=Math.max(1,Math.ceil(dist(a,b)/(r*.5))),E=[];
  for(let i=0;i<=n;i++)E.push({x:a.x+(b.x-a.x)*i/n,y:a.y+(b.y-a.y)*i/n});
  const minX=Math.min(a.x,b.x),maxX=Math.max(a.x,b.x),minY=Math.min(a.y,b.y),maxY=Math.max(a.y,b.y);
  let changed=false;const out=[];
  for(const it of items){
    if(it.kind==='stroke'){
      const t=r+it.w*(it.style==='wavy'||it.style==='double'?1.6:.8),t2=t*t;
      let hit=false;const flags=it.pts.map(p=>{if(p.x<minX-t||p.x>maxX+t||p.y<minY-t||p.y>maxY+t)return false;const h=E.some(e=>(p.x-e.x)**2+(p.y-e.y)**2<t2);if(h)hit=true;return h});
      if(!hit){out.push(it);continue}changed=true;let run=[];
      const flush=()=>{if(run.length>=2)out.push({...it,id:nextId++,pts:run});run=[]};
      it.pts.forEach((p,i)=>{if(flags[i])flush();else run.push(p)});flush();
    }else{const t=r+it.s*.6;if(E.some(e=>(it.x-e.x)**2+(it.y-e.y)**2<t*t)){changed=true;if(it.id===sel)sel=null;continue}out.push(it)}
  }
  if(changed){items=out;if(gesture)gesture.changed=true;scheduleRebuild()}
}

}

  $$('#framePresets .chip').forEach(b=>{const f=FRAMES.find(x=>x[0]===b.dataset.id);b.setAttribute('aria-pressed',FR.pad===f[2]&&FR.bot===f[3]&&(!f[2]&&!f[3]||FR.code===f[4]))});
  $$('#fcolors .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===FR.mode));
  $('#fcolors [data-id="accent"] i').style.background=mainColor();$('#fcolors [data-id="accent"]').title=K.on?'目前的保留色':'目前的畫筆顏色';
  $('#fcolors [data-id="custom"] i').style.background=FR.custom;$('#fcustom').value=FR.custom.toLowerCase();
  $('#codeOn').checked=FR.code;$('#codeFonts').hidden=!FR.code;
  const smp=codeColors()[0];$$('#codeFonts .chip').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.id===FR.font);b.querySelector('.smp').textContent=smp});
  if(sliders)frameSyncs.forEach(f=>f());
}
PRESETS.forEach(p=>{
  const b=document.createElement('button');b.className='chip preset';const c=document.createElement('canvas');b.append(c,p.name);$('#presets').append(b);
  b._draw=()=>preview(c,(g,w,h)=>{g.fillStyle='#2b2a2e';g.fillRect(0,0,w,h);const pts=[];for(let x=10;x<=w-30;x+=2)pts.push({x,y:h*.62+Math.sin(x/8)*4});
    drawStroke(g,{pts,style:p.style,texture:p.texture,color:p.color,w:2.6,glow:p.glow,seed:5});
    const sc=p.sprinkle.color||p.color;drawSticker(g,{type:p.sprinkle.types[0],x:w-16,y:h*.32,s:8,rot:0,color:sc,glow:p.glow,texture:'smooth'},false);
    drawSticker(g,{type:p.sprinkle.types[1],x:w*.3,y:h*.26,s:6,rot:.2,color:sc,glow:p.glow,texture:'smooth'},false)});
  b.onclick=()=>applyPreset(p);
});
TOOLS.forEach(([id,label,svg])=>{const b=document.createElement('button');b.className='tool';b.dataset.id=id;b.innerHTML=`<svg viewBox="0 0 24 24">${svg}</svg>`;b.append(label);b.onclick=()=>setTool(id);$('#tools').append(b)});
$('#glow').onchange=e=>{S.glow=e.target.checked;scheduleSave()};
$('#width').oninput=e=>{S.width=+e.target.value;if(gesture===null&&S.tool==='erase')render()};
$('#width').onchange=()=>scheduleSave();

function setTool(t){
  const wasCrop=cropMode;S.tool=t;cropMode=t==='crop';S.picking=false;
  if(TOOLS.some(x=>x[0]===t))lastDoodle=t;
  if(!(t==='sticker'||t==='text'))sel=null;
  $$('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==t);
  $$('[data-for]').forEach(el=>el.hidden=!el.dataset.for.split(' ').includes(t));
  $$('#tools .tool').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===t));
  $('#sizeLbl').textContent=t==='erase'?'橡皮擦':t==='draw'?'粗細':'大小';
  if(cropMode){status('拖動四角調整範圍，拉下方刻度可以把照片轉正',3200);syncCropUI()}
  if(t==='keep'){status('點照片上的顏色，只留下那個色，其他變成黑白灰',3200);syncKeepUI()}
  if(t==='frame'){status('選好外框樣式後，按右上角「匯出」',3200);syncFrameUI()}
  renderColors();
  requestAnimationFrame(()=>{if(cropMode!==wasCrop||cropMode)applyView();else{fitCss();render()}refreshPreviews()});
}
function syncCropUI(){
  $$('#aspects .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===V.aspect));
  $('#straight').value=V.straight;$('#angleVal').textContent=fmtAng(V.straight);
}
function syncUI(){
  $$('#styles .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===S.style));
  $$('#stickers .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===S.sticker));
  $$('#textures button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===S.texture));
  $$('#fontsRow .chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===S.font));
  $('#glow').checked=S.glow;$('#width').value=S.width;
  renderColors();if(V)syncCropUI();syncKeepUI();syncFrameUI();refreshPreviews();
}
const holdOn=e=>{e.preventDefault();if(showOrig)return;showOrig=true;rebuild()},holdOff=()=>{if(!showOrig)return;showOrig=false;rebuild()};
$('#hold').addEventListener('pointerdown',holdOn);['pointerup','pointerleave','pointercancel'].forEach(t=>$('#hold').addEventListener(t,holdOff));
$('#hold').addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')holdOn(e)});$('#hold').addEventListener('keyup',holdOff);
document.addEventListener('keydown',e=>{
  if(!$('#tsheet').hidden||e.target.closest?.('input,textarea'))return;
  if((e.key==='Delete'||e.key==='Backspace')&&getSel()){snap();items=items.filter(i=>i.id!==sel);sel=null;rebuild();scheduleSave()}
});

/* ---------- photo in / image out ---------- */
function loadImage(src){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=src})}
async function usePhoto(img){
  const k=Math.min(1,2400/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
  photo.width=Math.round((img.naturalWidth||img.width)*k);photo.height=Math.round((img.naturalHeight||img.height)*k);pctx.drawImage(img,0,0,photo.width,photo.height);
  KD=null;kKey='';
}
/* ---------- flow: home → crop → edit → frame ---------- */
const modeName=()=>mode==='keep'?'残り色':'落書き';
function freshWork(m){
  mode=m;V=defaultView();items=[];undoStack=[];sel=null;zoom={z:1,x:0,y:0};$('#undo').disabled=true;
  // a new photo starts in full colour; nothing is kept until the person taps a colour
  K={on:false,con:K.con,active:0,colors:[{h:0,rgb:[208,52,44],p:{...KDEF}}]};
  syncCropUI();syncKeepUI();syncFrameUI();renderColors();
}
function goStep(s){
  step=s;$('#home').hidden=s!=='home';
  if(s==='home'){$('#resume').hidden=!hasPhoto;$('#resume').textContent=`繼續上次的作品（${modeName()}）`;status('');return}
  savedStep=s;zoom={z:1,x:0,y:0};
  $('#steps [data-step="edit"]').textContent=modeName();
  $$('#steps button').forEach(b=>b.setAttribute('aria-current',b.dataset.step===s?'step':'false'));
  $('#hold').hidden=s==='crop';$('#next').textContent=s==='frame'?'匯出':'下一步';
  $('#tools').hidden=!(s==='edit'&&mode==='doodle');
  setTool(s==='crop'?'crop':s==='frame'?'frame':mode==='keep'?'keep':lastDoodle);
  scheduleSave();
}
function drawModeCards(){
  preview($('#mKeep'),(g,w,h)=>{ // grey rainy street, one red umbrella
    const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#c4c4c4');gr.addColorStop(1,'#6a6a6a');g.fillStyle=gr;g.fillRect(0,0,w,h);
    for(let x=0,i=0;x<w;i++){const bw=34+(i*37)%26,bh=38+(i*53)%44;g.fillStyle=['#8a8a8a','#757575','#9b9b9b'][i%3];g.fillRect(x,h*.74-bh,bw,bh);x+=bw+3}
    g.fillStyle='#4c4c4c';g.fillRect(0,h*.74,w,h);
    const cx=w*.5,cy=h*.6;g.fillStyle='#2a2a2a';g.fillRect(cx-4,cy,8,h*.3);g.beginPath();g.arc(cx,cy-4,6,0,7);g.fill();
    g.strokeStyle='#222';g.lineWidth=2;g.beginPath();g.moveTo(cx,cy-36);g.lineTo(cx,cy);g.stroke();
    g.fillStyle='#d0342c';g.beginPath();g.moveTo(cx-38,cy-18);g.quadraticCurveTo(cx,cy-66,cx+38,cy-18);g.closePath();g.fill();
    g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1;for(let i=0;i<60;i++){const x=(i*73)%w,y=(i*41)%h;g.beginPath();g.moveTo(x,y);g.lineTo(x-3,y+9);g.stroke()}
  });
  preview($('#mDoodle'),(g,w,h)=>{ // glittery doodle loop with stickers
    g.fillStyle='#2b2a2e';g.fillRect(0,0,w,h);
    const pts=[];for(let x=26;x<=w-26;x+=2)pts.push({x,y:h*.56+Math.sin(x/15)*12});
    drawStroke(g,{pts,style:'hand',texture:'glitter',color:'#F6D24A',w:3.4,glow:true,seed:5});
    const st=(type,x,y,s,color)=>drawSticker(g,{type,x,y,s,rot:0,color,glow:true,texture:'smooth'},false);
    st('star',w*.16,h*.26,13,'#F6D24A');st('heart',w*.82,h*.27,12,'#F28BB5');st('sparkle',w*.5,h*.22,10,'#FFFFFF');st('flower',w*.68,h*.84,10,'#9CC9F2');st('paw',w*.3,h*.85,10,'#F28BB5');
  });
}
function pickPhoto(m){pendingMode=m;$('#file').click()}
$$('.mode').forEach(b=>b.onclick=()=>pickPhoto(b.dataset.mode));
$$('[data-sample]').forEach(b=>b.onclick=()=>{sample(b.dataset.sample);hasPhoto=false;photoBlob=null;freshWork(b.dataset.sample);
  if(b.dataset.sample==='keep'){K.on=true;K.colors=[{h:44,rgb:[246,196,52],p:{...KDEF}}];syncKeepUI();syncFrameUI()}
  if(b.dataset.sample==='doodle')sampleDoodles();$('#badge').hidden=false;goStep('crop')});
$('#resume').onclick=()=>goStep(savedStep);
$('#repick').onclick=()=>pickPhoto(mode);
$('#back').onclick=()=>goStep(step==='crop'?'home':STEPS[STEPS.indexOf(step)-1]);
$('#next').onclick=()=>step==='frame'?exportImage():goStep(STEPS[STEPS.indexOf(step)+1]);
$$('#steps button').forEach(b=>b.onclick=()=>goStep(b.dataset.step));
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const url=URL.createObjectURL(f);
  try{const img=await loadImage(url);await usePhoto(img);
    photoBlob=await new Promise(r=>photo.toBlob(r,'image/jpeg',.92));hasPhoto=true;
    freshWork(pendingMode);$('#badge').hidden=true;goStep('crop');
  }catch(err){status('這張照片打不開，換一張試試',3000)}finally{URL.revokeObjectURL(url)}
};
let outUrl=null,outFile=null;
async function exportImage(){
  const o=outSize(),c=document.createElement('canvas');c.width=o.w;c.height=o.h;renderScene(c.getContext('2d'));
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.93));if(!blob){status('存圖失敗，請再試一次');return}
  const d=new Date(),p=n=>String(n).padStart(2,'0'),name=`keepsake-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
  if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(blob);
  outFile=new File([blob],name,{type:'image/jpeg'});
  let canShare=false;try{canShare=!!(navigator.canShare&&navigator.canShare({files:[outFile]}))}catch(e){}
  $('#out').src=outUrl;$('#download').href=outUrl;$('#download').download=name;$('#share').hidden=!canShare;
  $('#sheet').hidden=false;
}
$('#share').onclick=()=>{navigator.share({files:[outFile]}).catch(e=>{if(e&&e.name!=='AbortError')status('分享沒有成功，可以改用「下載圖片」或長按圖片儲存',3500)})};
$('#close').onclick=()=>$('#sheet').hidden=true;

/* ---------- sample scene (drawn in code, no photo) ---------- */
function sample(m){
  photo.width=900;photo.height=1300;const c=pctx,r=rng(42);
  c.fillStyle='#2b2a2e';c.fillRect(0,0,900,1300);
  for(let i=0;i<14000;i++){c.fillStyle=r()<.5?'rgba(255,255,255,.07)':'rgba(0,0,0,.28)';const s=1+r()*2.5;c.fillRect(r()*900,r()*1300,s,s)}
  c.save();c.rotate(-.35);c.fillStyle='rgba(255,226,170,.07)';for(let i=0;i<4;i++)c.fillRect(-200,180+i*260,1400,70);c.restore();
  c.save();c.lineCap='round';c.strokeStyle='#d6bf9b';c.lineWidth=230;c.beginPath();c.moveTo(560,1080);c.lineTo(1000,1450);c.stroke();
  c.strokeStyle='rgba(120,96,64,.25)';c.lineWidth=3;for(let i=0;i<22;i++){c.beginPath();c.moveTo(500+i*22,1010+i*18);c.lineTo(420+i*22,1110+i*18);c.stroke()}c.restore();
  c.strokeStyle='#7fa34a';c.lineWidth=12;c.lineCap='round';
  const heads=[[330,470,120],[565,440,112],[445,660,128],[640,640,96],[300,720,88]];
  for(const[x,y]of heads){c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(470,860,480,1180);c.stroke()}
  c.fillStyle='#e7b48f';c.beginPath();c.ellipse(482,965,52,62,.2,0,7);c.fill();
  for(const[x,y,a]of[[200,620,-.7],[720,560,.6],[250,820,-.3],[690,780,.5],[440,330,0]]){c.save();c.translate(x,y);c.rotate(a);const g=c.createLinearGradient(-90,0,90,0);g.addColorStop(0,'#5f8a3a');g.addColorStop(1,'#a9c76a');c.fillStyle=g;c.beginPath();c.ellipse(0,0,95,42,0,0,7);c.fill();c.strokeStyle='rgba(40,70,20,.5)';c.lineWidth=3;c.beginPath();c.moveTo(-85,0);c.lineTo(85,0);c.stroke();c.restore()}
  for(const[x,y,R]of heads){
    for(const[layer,col,n,len]of[[0,'#e9a31b',20,1],[1,'#f8cd3c',18,.86]])for(let i=0;i<n;i++){c.save();c.translate(x,y);c.rotate(i*Math.PI*2/n+layer*.17+(r()-.5)*.08);const g=c.createLinearGradient(0,0,0,-R);g.addColorStop(0,'#c97d10');g.addColorStop(1,col);c.fillStyle=g;c.beginPath();c.ellipse(0,-R*.62*len,R*.15,R*.42*len,0,0,7);c.fill();c.restore()}
    const g=c.createRadialGradient(x,y,2,x,y,R*.38);g.addColorStop(0,'#2a160a');g.addColorStop(1,'#5a3214');c.fillStyle=g;c.beginPath();c.arc(x,y,R*.38,0,7);c.fill();
    c.fillStyle='rgba(150,90,30,.55)';for(let i=0;i<70;i++){const a=i*2.4,d=Math.sqrt(i/70)*R*.34;c.beginPath();c.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,2.2,0,7);c.fill()}
  }
  V=defaultView();KD=null;kKey='';
}
function sampleDoodles(){
  const loop=[],n=noise1(9);for(let t=0;t<=1.02;t+=.008){const a=-Math.PI*.62+t*Math.PI*1.9,k=1+n(t*6)*.08;loop.push({x:470+Math.cos(a)*330*k,y:610+Math.sin(a)*390*k})}
  const Y='#F6D24A',st=(type,x,y,s,rot)=>({kind:'sticker',id:nextId++,type,x,y,s,rot,color:Y,glow:true,texture:'smooth'});
  items=[{kind:'stroke',id:nextId++,pts:loop,style:'wavy',texture:'glitter',color:Y,w:7.8,glow:true,seed:3},
    st('star',150,230,46,-.2),st('sparkle',250,200,30,0),st('smile',740,240,52,.1),st('sparkle',780,900,34,.1),st('dot',820,380,20,0),st('plus',110,880,24,.3),st('sparkle',120,1050,26,0),
    {kind:'text',id:nextId++,text:'今天的花',font:'hand',x:690,y:1200,s:58,rot:-.08,color:'#FFFFFF',glow:false}];
}

/* ---------- start ---------- */
(async()=>{
  let restored=false;
  try{
    const st=await DB.get('settings');if(st){const{FR:f,...rest}=st;Object.assign(S,rest,{tool:'draw',picking:false});if(f)FR={...FR,...f}}
    const d=await DB.get('draft');
    if(d?.photo){const url=URL.createObjectURL(d.photo);const img=await loadImage(url);URL.revokeObjectURL(url);await usePhoto(img);
      photoBlob=d.photo;items=d.items||[];V=d.V;hasPhoto=true;restored=true;
      if(d.K)K=d.K;if(d.FR)FR={...FR,...d.FR};mode=d.mode||(K.on?'keep':'doodle');savedStep=d.step||'edit';
      nextId=Math.max(0,...items.map(i=>i.id||0))+1}
  }catch(e){}
  if(!restored){sample('doodle');V=defaultView()}
  syncUI();setTool(mode==='keep'?'keep':'draw');goStep('home');drawModeCards();
  if(document.fonts){Promise.all(FONTS.map(F=>document.fonts.load(`${F.w} 40px ${F.fam}`,'花Aa今天#0123456789ABCDEF'))).then(()=>{refreshPreviews();rebuild()}).catch(()=>{});
    const texts=items.filter(i=>i.kind==='text');Promise.all(texts.map(t=>document.fonts.load(fontStr(t),t.text))).then(()=>rebuild()).catch(()=>{})}
})();

/* ---------- app shell: offline + no page zoom on iOS ---------- */
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>{if(e.target.closest('.app'))e.preventDefault()},{passive:false});
if('serviceWorker' in navigator&&window.isSecureContext)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
